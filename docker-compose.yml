services:
  caddy:
    # caddy:2-alpine + the Cloudflare DNS plugin (see caddy/Dockerfile).
    build: ./caddy
    network_mode: host
    environment:
      # Only used when HTTPS is enabled in Settings → Tailscale. Put it in a
      # .env file next to this compose file; it is read by Caddy directly
      # for the ACME DNS-01 challenge and never stored by Gantry.
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
    volumes:
      - ./logs:/logs
      - ./caddy-data:/data
      - ./caddy-config:/config
    restart: unless-stopped

  backend:
    build: .
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data:/app/data
      - ./logs:/logs
    environment:
      - PORT=3001
      - CADDY_ADMIN=http://localhost:2019
      - DB_PATH=/app/data/proxy.db
      - LOG_PATH=/logs/access.log
      # Same token, only so the Settings page can say whether it is set.
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
    restart: unless-stopped
    depends_on:
      - caddy
