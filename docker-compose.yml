services:
  caddy:
    # caddy:2-alpine + the Cloudflare DNS plugin (see caddy/Dockerfile).
    build: ./caddy
    network_mode: host
    environment:
      # Only used when HTTPS is enabled in Settings → Tailscale. Put it in a
      # .env file next to this compose file; it is read by Caddy directly
      # for the ACME DNS-01 challenge and never stored by Gantry.
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
    volumes:
      - ./logs:/logs
      - ./caddy-data:/data
      - ./caddy-config:/config
    restart: unless-stopped

  backend:
    build: .
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data:/app/data
      - ./logs:/logs
      # Host terminal key + pinned host key (scripts/enable-host-shell.sh).
      - ./host-shell:/app/host-shell:ro
    environment:
      - PORT=3001
      - CADDY_ADMIN=http://localhost:2019
      - DB_PATH=/app/data/proxy.db
      - LOG_PATH=/logs/access.log
      # Same token, only so the Settings page can say whether it is set.
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
      # Login (optional). Unset GANTRY_PASSWORD_HASH = no login, as before.
      # Set it with scripts/set-password.sh; see README → Login.
      - GANTRY_USERNAME=${GANTRY_USERNAME:-admin}
      - GANTRY_PASSWORD_HASH=${GANTRY_PASSWORD_HASH:-}
      - GANTRY_SESSION_TTL_HOURS=${GANTRY_SESSION_TTL_HOURS:-168}
      # Bearer token for non-browser clients (the MCP server), 32+ chars.
      - GANTRY_API_TOKEN=${GANTRY_API_TOKEN:-}
      # Extra hostnames the UI may be opened on (comma list, *.suffix ok).
      - GANTRY_ALLOWED_HOSTS=${GANTRY_ALLOWED_HOSTS:-}
      # Host terminal (optional, needs a login): SSH to this machine's sshd.
      - GANTRY_HOST_SHELL=${GANTRY_HOST_SHELL:-0}
      - GANTRY_HOST_SHELL_USER=${GANTRY_HOST_SHELL_USER:-}
      - GANTRY_HOST_SHELL_PORT=${GANTRY_HOST_SHELL_PORT:-22}
      - GANTRY_HOST_SHELL_IDLE_MINUTES=${GANTRY_HOST_SHELL_IDLE_MINUTES:-30}
      # Authenticator (TOTP) secret: unlocking the host terminal then also
      # needs a 6-digit code. Set by scripts/set-password.sh.
      - GANTRY_TOTP_SECRET=${GANTRY_TOTP_SECRET:-}
    restart: unless-stopped
    depends_on:
      - caddy
